<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個人情報ガード</title><meta name="robots" content="noindex"><style>body{margin:0;background:#080810;color:#e8e8f0;font-family:-apple-system,"Hiragino Sans",sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#a5b4fc}</style></head><body><div><p>個人情報ガード は security-hub の中に移りました。</p><p><a id="go" href="https://norinori-jan.github.io/security-hub/leak-shield/">開く →</a></p></div><script>(function(){var n="https://norinori-jan.github.io/security-hub/leak-shield/";var t=n+location.search+location.hash;document.getElementById('go').href=t;try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(r.scope.indexOf('/leak-shield/')>0)r.unregister()})});if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){if(k.indexOf('leak-shield')===0)caches.delete(k)})})}catch(e){}location.replace(t)})();</script></body></html>
